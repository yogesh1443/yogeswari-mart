<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOGESWARI MART - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

/* ================= LOGIN PAGE ================= */

#loginPage{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
    linear-gradient(
        135deg,
        rgba(8,25,55,.95),
        rgba(20,80,160,.82)
    ),
    url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;

    background-position:center;
}

/* ================= LOGIN BOX ================= */

.login-box{

    width:390px;

    max-width:100%;

    background:white;

    padding:35px;

    border-radius:22px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.3);
}

/* ================= LOGO ================= */

.logo{

    text-align:center;

    font-size:32px;

    font-weight:900;

    color:#1565d8;
}

.logo span{

    color:#ff6b00;
}

/* ================= SUBTITLE ================= */

.login-sub{

    text-align:center;

    color:#777;

    margin:7px 0 25px;
}

/* ================= INPUT ================= */

.input-group{

    margin-bottom:17px;
}

.input-group label{

    display:block;

    font-weight:bold;

    margin-bottom:7px;
}

.input-group input{

    width:100%;

    padding:13px;

    border:1px solid #d6dbe5;

    border-radius:10px;

    outline:none;

    font-size:14px;
}

.input-group input:focus{

    border-color:#1565d8;

    box-shadow:0 0 0 2px rgba(21,101,216,.1);
}

/* ================= PASSWORD ================= */

.password-wrap{

    position:relative;
}

.password-wrap input{

    padding-right:45px;
}

.eye{

    position:absolute;

    right:13px;

    top:12px;

    cursor:pointer;

    font-size:18px;
}

/* ================= REMEMBER ================= */

.login-options{

    display:flex;

    justify-content:space-between;

    font-size:13px;

    margin-bottom:20px;
}

.login-options a{

    color:#1565d8;

    cursor:pointer;
}

/* ================= LOGIN BUTTON ================= */

.main-btn{

    width:100%;

    border:none;

    background:#1565d8;

    color:white;

    padding:14px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.main-btn:hover{

    background:#0d4fac;
}

/* ================= MESSAGE ================= */

#errorMsg{

    text-align:center;

    margin-top:12px;

    font-size:13px;

    font-weight:bold;
}

/* ================= CREATE ACCOUNT ================= */

.create-account{

    text-align:center;

    margin-top:20px;

    font-size:14px;
}

.create-account span{

    color:#1565d8;

    font-weight:bold;

    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:450px){

    .login-box{

        padding:25px;
    }

    .logo{

        font-size:27px;
    }

}

</style>

</head>


<body>


<!-- ================= LOGIN PAGE ================= -->

<div id="loginPage">

    <div class="login-box">


        <!-- LOGO -->

        <div class="logo">

            YOGESWARI <span>MART</span>

        </div>


        <!-- SUBTITLE -->

        <p class="login-sub">

            Your Fashion & Beauty Shopping Destination

        </p>


        <!-- EMAIL -->

        <div class="input-group">

            <label>

                Email ID

            </label>

           <input
    type="email"
    id="loginEmail"
    name="username"
    placeholder="example@gmail.com"
    autocomplete="username"
    required>
        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>

                Password

            </label>

            <div class="password-wrap">
        <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required>

                <span
                    class="eye"
                    onclick="togglePassword()">

                    👁

                </span>

            </div>

        </div>


        <!-- REMEMBER -->

        <div class="login-options">

            <label>

                <input
                    type="checkbox"
                    id="rememberMe">

                Remember me

            </label>


            <a onclick="forgotPassword()">

                Forgot Password?

            </a>

        </div>


        <!-- LOGIN -->

       <form id="loginForm" onsubmit="event.preventDefault(); login();">
    <button type="submit" class="main-btn">
        LOGIN
    </button>
</form>

        <!-- MESSAGE -->

        <p id="errorMsg"></p>


        <!-- CREATE ACCOUNT -->

        <div class="create-account">

            New to YOGESWARI MART?

            <span onclick="createAccount()">

                Create New Account

            </span>

        </div>


    </div>

</div>


<script>

/* =====================================================
   EMAIL VALIDATION
===================================================== */

function isValidEmail(email){

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    return emailPattern.test(email);

}


/* =====================================================
   LOGIN FUNCTION
===================================================== */

function login(){

    const email =
        document.getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;

    const errorMsg =
        document.getElementById("errorMsg");


    /* Clear old message */

    errorMsg.textContent = "";


    /* ================= EMAIL EMPTY ================= */

    if(email === ""){

        errorMsg.style.color = "#e53935";

        errorMsg.textContent =
            "Please enter your email ID.";

        return;

    }


    /* ================= EMAIL VALIDATION ================= */

    if(!isValidEmail(email)){

        errorMsg.style.color = "#e53935";

        errorMsg.textContent =
            "Please enter a valid email ID.";

        return;

    }


    /* ================= PASSWORD EMPTY ================= */

    if(password === ""){

        errorMsg.style.color = "#e53935";

        errorMsg.textContent =
            "Please enter your password.";

        return;

    }


    /* =================================================
       GET SAVED USERS
    ================================================= */

    let users =
        JSON.parse(
            localStorage.getItem("yogeswariUsers")
        ) || [];


    /* =================================================
       CHECK WHETHER EMAIL ALREADY EXISTS
    ================================================= */

    const existingUser =
        users.find(
            user => user.email === email
        );


    /* =================================================
       EXISTING USER
    ================================================= */

    if(existingUser){

        /* Check password */

        if(existingUser.password !== password){

            errorMsg.style.color = "#e53935";

            errorMsg.textContent =
                "Incorrect password. Please try again.";

            return;

        }


        /* ================= LOGIN SUCCESS ================= */

        localStorage.setItem(
            "yogeswariLoggedIn",
            "true"
        );

        localStorage.setItem(
            "yogeswariCurrentUser",
            email
        );


        errorMsg.style.color = "#16a34a";

        errorMsg.textContent =
            "Login successful! Opening YOGESWARI MART...";


        setTimeout(function(){

            window.location.href = "index.html";

        },800);


        return;

    }


    /* =================================================
       NEW EMAIL
       FIRST TIME LOGIN
    ================================================= */

    const newUser = {

        email: email,

        password: password

    };


    users.push(newUser);


    /* Save users in browser */

    localStorage.setItem(
        "yogeswariUsers",
        JSON.stringify(users)
    );


    /* Save current login */

    localStorage.setItem(
        "yogeswariLoggedIn",
        "true"
    );

    localStorage.setItem(
        "yogeswariCurrentUser",
        email
    );


    errorMsg.style.color = "#16a34a";

    errorMsg.textContent =
        "Account saved! Opening YOGESWARI MART...";


    /* Open index page */

    setTimeout(function(){

        window.location.href = "index.html";

    },800);

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(){

    const input =
        document.getElementById("loginPassword");

    if(input.type === "password"){

        input.type = "text";

    }
    else{

        input.type = "password";

    }

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

function forgotPassword(){

    alert(
        "Password reset feature will be connected with the Java + MySQL backend later."
    );

}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

function createAccount(){
    window.location.href = "register.html";
}

/* =====================================================
   REMEMBER LAST EMAIL
===================================================== */

window.onload = function(){

    const savedEmail =
        localStorage.getItem(
            "yogeswariLastEmail"
        );

    if(savedEmail){

        document.getElementById("loginEmail")
        .value = savedEmail;

    }

};


/* =====================================================
   SAVE EMAIL WHEN REMEMBER ME IS USED
===================================================== */

document
.getElementById("loginEmail")
.addEventListener("change", function(){

    const remember =
        document.getElementById("rememberMe").checked;

    if(remember){

        localStorage.setItem(
            "yogeswariLastEmail",
            this.value.trim().toLowerCase()
        );

    }

});


</script>
